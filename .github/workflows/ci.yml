name: Vivaah CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vivaah-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivaah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vivaah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vivaah
      DATABASE_SSL: disable
      OTP_PEPPER: ci-only-secret-not-used-for-real-authentication-000000
      RESEND_API_KEY: re_ci_placeholder
      AUTH_EMAIL_FROM: Vivaah CI <ci@example.invalid>
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0002_identity_consent_hardening.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0003_contact_verification_discovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0004_member_safety.sql
      - name: Database regression tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/0002_identity_consent_hardening.sql
      - name: Production build
        run: npm run build
